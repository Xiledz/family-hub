<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Hub — Design Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0d10;color:#e8eaed;-webkit-font-smoothing:antialiased}

/* ============ PREVIEW CHROME ============ */
.chrome{position:sticky;top:0;z-index:100;background:rgba(14,17,21,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.09)}
.chrome-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chrome-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7d8590;white-space:nowrap}
.tabs{display:flex;gap:5px;background:rgba(255,255,255,.05);padding:4px;border-radius:11px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:#9aa3ad;font:600 13px/1 Inter,sans-serif;padding:9px 14px;border-radius:8px;cursor:pointer;transition:.16s;white-space:nowrap}
.tab:hover{color:#e8eaed}
.tab[aria-selected="true"]{background:#e8eaed;color:#0b0d10}
.tab small{display:block;font-weight:500;font-size:10px;opacity:.6;margin-top:3px;letter-spacing:.02em}
.tab[aria-selected="true"] small{opacity:.55}
.spacer{flex:1}
.vp{display:flex;gap:4px;background:rgba(255,255,255,.05);padding:4px;border-radius:10px}
.vp button{border:0;background:transparent;color:#9aa3ad;font:600 12px/1 Inter,sans-serif;padding:8px 12px;border-radius:7px;cursor:pointer}
.vp button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}

.stage{padding:22px 16px 60px;display:flex;justify-content:center}
.stage[data-vp="phone"] .frame{width:390px;max-width:100%;border-radius:38px;overflow:hidden;border:9px solid #22262c;box-shadow:0 30px 70px -20px rgba(0,0,0,.85);height:800px;overflow-y:auto;position:relative}
.frame{width:100%;max-width:1240px;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -24px rgba(0,0,0,.7)}
.stage[data-vp="phone"] .frame::-webkit-scrollbar{width:0}

.note{max-width:1240px;margin:0 auto 18px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:13.5px;line-height:1.6;color:#aeb6bf}
.note b{color:#e8eaed}
.note .kv{display:flex;gap:8px;margin-top:6px}
.note .kv span:first-child{color:#7d8590;min-width:78px;flex-shrink:0}

/* ============ SHARED APP PRIMITIVES ============ */
.app{min-height:640px;display:flex;flex-direction:column}
.app *{box-sizing:border-box}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hidden{display:none!important}

/* ================================================================
   DESIGN A — HEARTH  (warm editorial paper)
   ================================================================ */
.hearth{background:#f7f2e8;color:#2c261f;font-family:Inter,sans-serif}
.hearth .top{padding:26px 30px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid #e0d6c4}
.hearth .month{font-family:Fraunces,Georgia,serif;font-size:44px;line-height:.95;font-weight:600;letter-spacing:-.02em;margin:0}
.hearth .month span{color:#a89878;font-weight:400}
.hearth .sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9b8f7c;margin-top:9px;font-weight:600}
.hearth .navbtns{display:flex;gap:8px}
.hearth .nb{width:38px;height:38px;border-radius:50%;border:1px solid #ddd2be;background:#fffdf8;color:#5c5346;font-size:15px;cursor:pointer;display:grid;place-items:center}
.hearth .add{border:0;background:#2c261f;color:#f7f2e8;font:600 13px Inter;padding:11px 20px;border-radius:99px;cursor:pointer}
.hearth .people{display:flex;gap:16px;padding:14px 30px;border-bottom:1px solid #e0d6c4;flex-wrap:wrap}
.hearth .chipp{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#5c5346}
.hearth .grid{display:grid;grid-template-columns:repeat(7,1fr);flex:1}
.hearth .dow{padding:12px 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#a5987f;font-weight:700;text-align:left;border-bottom:1px solid #e0d6c4}
.hearth .cell{min-height:112px;padding:8px 9px 10px;border-right:1px solid #ebe2d3;border-bottom:1px solid #ebe2d3;display:flex;flex-direction:column;gap:4px}
.hearth .cell:nth-child(7n){border-right:0}
.hearth .cell.out{background:#f2ece0}
.hearth .cell.out .dnum{color:#c3b8a3}
.hearth .dnum{font-family:Fraunces,serif;font-size:16px;font-weight:600;color:#5c5346;margin-bottom:2px}
.hearth .cell.today .dnum{background:#2c261f;color:#f7f2e8;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:14px;margin:-3px 0 2px -3px}
.hearth .ev{font-size:11.5px;line-height:1.3;padding:4px 7px;border-radius:6px;background:#fffdf8;border-left:3px solid var(--c);color:#3d362c;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hearth .ev em{font-style:normal;color:#94886f;font-weight:600;font-size:10.5px}
.hearth .more{font-size:10.5px;color:#a5987f;font-weight:600;padding-left:4px}
.hearth .agenda{display:none}
@media(max-width:760px){
  .hearth .top{padding:20px 18px 16px;flex-direction:column;align-items:flex-start}
  .hearth .month{font-size:34px}
  .hearth .people{padding:12px 18px;gap:12px}
  .hearth .grid{display:none}
  .hearth .agenda{display:block;padding:4px 18px 90px}
  .hearth .aday{padding:16px 0;border-bottom:1px solid #e6dcca}
  .hearth .aday.today .adate{color:#b0442a}
  .hearth .adate{font-family:Fraunces,serif;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#9b8f7c;margin-bottom:9px}
  .hearth .arow{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;background:#fffdf8;border-radius:10px;margin-bottom:7px;border-left:3px solid var(--c)}
  .hearth .atime{font-size:11.5px;font-weight:700;color:#94886f;min-width:56px;padding-top:1px}
  .hearth .atitle{font-size:14.5px;font-weight:600;flex:1}
  .hearth .awho{font-size:11.5px;color:#94886f;margin-top:2px;font-weight:500}
  .hearth .fab{position:sticky;bottom:18px;float:right;margin-right:2px}
}

/* ================================================================
   DESIGN B — AURORA  (dark glass, night-mode native)
   ================================================================ */
.aurora{background:radial-gradient(1100px 600px at 78% -12%,#243a5e 0%,transparent 62%),radial-gradient(800px 500px at 8% 108%,#3d2450 0%,transparent 60%),#0d1017;color:#eef1f6;font-family:"Space Grotesk",Inter,sans-serif}
.aurora .top{padding:24px 28px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.aurora .month{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0}
.aurora .month span{color:#7a8598;font-weight:400}
.aurora .glasspill{display:flex;gap:3px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);padding:4px;border-radius:11px;backdrop-filter:blur(20px)}
.aurora .glasspill button{border:0;background:transparent;color:#8d97a8;font:600 12.5px "Space Grotesk";padding:8px 15px;border-radius:8px;cursor:pointer}
.aurora .glasspill button.on{background:rgba(255,255,255,.13);color:#fff}
.aurora .add{border:0;background:linear-gradient(135deg,#6f8cff,#a06bff);color:#fff;font:600 13px "Space Grotesk";padding:11px 20px;border-radius:99px;cursor:pointer;box-shadow:0 6px 22px -6px rgba(122,110,255,.75)}
.aurora .people{display:flex;gap:9px;padding:0 28px 16px;flex-wrap:wrap}
.aurora .chipp{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#c3cbd8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:6px 12px;border-radius:99px}
.aurora .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 28px 28px;flex:1}
.aurora .dow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6c7789;font-weight:700;text-align:center;padding-bottom:6px}
.aurora .cell{min-height:104px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);padding:8px;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(10px)}
.aurora .cell.out{background:rgba(255,255,255,.015);border-color:rgba(255,255,255,.035)}
.aurora .cell.out .dnum{color:#4a5364}
.aurora .cell.today{border-color:rgba(140,150,255,.55);background:rgba(120,130,255,.11);box-shadow:0 0 0 1px rgba(140,150,255,.25),0 8px 30px -12px rgba(120,130,255,.6)}
.aurora .dnum{font-size:13px;font-weight:600;color:#aab4c4;margin-bottom:1px}
.aurora .cell.today .dnum{color:#fff}
.aurora .ev{font-size:11px;line-height:1.3;padding:5px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);color:#eaeef5;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aurora .ev em{font-style:normal;color:var(--c);font-weight:700;font-size:10px}
.aurora .more{font-size:10px;color:#6c7789;font-weight:600;padding-left:3px}
.aurora .agenda{display:none}
@media(max-width:760px){
  .aurora .top{padding:20px 18px 14px;flex-wrap:wrap}
  .aurora .month{font-size:26px}
  .aurora .people{padding:0 18px 14px}
  .aurora .grid{display:none}
  .aurora .agenda{display:block;padding:0 18px 90px}
  .aurora .wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
  .aurora .wd{border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:9px 0 8px;text-align:center}
  .aurora .wd.on{background:linear-gradient(150deg,#6f8cff,#a06bff);border-color:transparent}
  .aurora .wd b{display:block;font-size:15px;font-weight:600}
  .aurora .wd i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#8d97a8;margin-bottom:3px}
  .aurora .wd.on i{color:rgba(255,255,255,.75)}
  .aurora .wd .pips{display:flex;gap:2.5px;justify-content:center;margin-top:5px;height:4px}
  .aurora .wd .pips span{width:4px;height:4px;border-radius:50%}
  .aurora .aday{margin-bottom:22px}
  .aurora .adate{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6c7789;font-weight:700;margin-bottom:10px}
  .aurora .aday.today .adate{color:#95a5ff}
  .aurora .arow{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;position:relative;overflow:hidden}
  .aurora .arow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .aurora .atime{font-size:11.5px;font-weight:700;color:var(--c);min-width:58px;padding-top:2px}
  .aurora .atitle{font-size:15px;font-weight:600;flex:1}
  .aurora .awho{font-size:11.5px;color:#8d97a8;margin-top:3px;font-weight:500}
}

/* ================================================================
   DESIGN C — BULLETIN  (bento dashboard, module-ready)
   ================================================================ */
.bulletin{background:#f1f3f7;color:#151a22;font-family:Inter,sans-serif}
.bulletin .top{padding:24px 26px 4px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bulletin .hello{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0}
.bulletin .hello span{color:#7b8494;font-weight:500}
.bulletin .add{border:0;background:#151a22;color:#fff;font:600 13px Inter;padding:11px 20px;border-radius:10px;cursor:pointer}
.bulletin .bento{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;padding:18px 26px 28px;flex:1;align-items:start}
.bulletin .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.28)}
.bulletin .ch{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#8b94a4;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.bulletin .ch b{color:#151a22;font-size:10.5px}
.bulletin .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.bulletin .tdate{font-size:13px;color:#7b8494;font-weight:600;margin-bottom:2px}
.bulletin .tbig{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:0 0 18px}
.bulletin .trow{display:flex;gap:13px;align-items:flex-start;padding:13px;border-radius:13px;background:#f6f7fa;margin-bottom:8px;border-left:3px solid var(--c)}
.bulletin .ttime{font-size:12px;font-weight:700;color:#606a7b;min-width:60px;padding-top:1px}
.bulletin .ttitle{font-size:15px;font-weight:600;flex:1;line-height:1.3}
.bulletin .twho{font-size:11.5px;color:#7b8494;margin-top:3px;font-weight:500}
.bulletin .weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.bulletin .wd{border-radius:12px;background:#f6f7fa;padding:10px 4px 9px;text-align:center;border:1.5px solid transparent}
.bulletin .wd.on{background:#151a22;color:#fff}
.bulletin .wd i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8b94a4;font-weight:700}
.bulletin .wd.on i{color:rgba(255,255,255,.65)}
.bulletin .wd b{display:block;font-size:16px;font-weight:700;margin-top:3px}
.bulletin .pips{display:flex;gap:3px;justify-content:center;margin-top:6px;height:5px}
.bulletin .pips span{width:5px;height:5px;border-radius:50%}
.bulletin .up{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}
.bulletin .up:last-child{border-bottom:0}
.bulletin .upd{width:42px;text-align:center;flex-shrink:0}
.bulletin .upd i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#8b94a4;font-weight:700}
.bulletin .upd b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.bulletin .upt{font-size:13.5px;font-weight:600;flex:1;line-height:1.35}
.bulletin .upm{font-size:11.5px;color:#7b8494;font-weight:500;margin-top:1px}
.bulletin .lane{display:flex;align-items:center;gap:10px;padding:9px 0}
.bulletin .lane .nm{font-size:13.5px;font-weight:600;flex:1}
.bulletin .lane .ct{font-size:11.5px;font-weight:700;color:#8b94a4;background:#f1f3f7;padding:3px 9px;border-radius:99px}
.bulletin .soon{border:2px dashed #d7dce5;background:transparent;box-shadow:none;text-align:center;padding:24px 20px;color:#8b94a4}
.bulletin .soon b{display:block;color:#606a7b;font-size:13.5px;margin-bottom:4px}
.bulletin .soon span{font-size:12px;line-height:1.5}
@media(max-width:860px){
  .bulletin .bento{display:flex;flex-direction:column;padding:16px 16px 90px;gap:12px}
  .bulletin .col{display:contents}
  .bulletin .top{padding:20px 16px 2px}
  .bulletin .hello{font-size:22px}
  .bulletin .tbig{font-size:42px;margin-bottom:14px}
  .bulletin .card{padding:17px}
}

/* ================================================================
   DESIGN D — RAIL  (continuous timeline, Fantastical-style)
   ================================================================ */
.rail{background:#fcfcfd;color:#121417;font-family:Inter,sans-serif}
.rail .top{padding:20px 26px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #eaecf0;position:sticky;top:0;background:rgba(252,252,253,.94);backdrop-filter:blur(14px);z-index:5}
.rail .month{font-family:"Instrument Serif",Georgia,serif;font-size:30px;font-weight:400;letter-spacing:-.01em;margin:0}
.rail .month span{color:#98a0ae}
.rail .add{border:0;background:#121417;color:#fff;font:600 13px Inter;padding:10px 18px;border-radius:99px;cursor:pointer}
.rail .body{display:grid;grid-template-columns:270px 1fr;flex:1}
.rail .side{border-right:1px solid #eaecf0;padding:22px 22px 30px;position:sticky;top:71px;align-self:start}
.rail .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:24px}
.rail .mini i{font-style:normal;font-size:9.5px;text-align:center;color:#98a0ae;font-weight:700;letter-spacing:.06em;padding-bottom:5px}
.rail .mini b{font-weight:500;font-size:12px;text-align:center;padding:6px 0;border-radius:7px;color:#3f4653;position:relative}
.rail .mini b.out{color:#c8cdd6}
.rail .mini b.on{background:#121417;color:#fff;font-weight:600}
.rail .mini b.has::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3.5px;height:3.5px;border-radius:50%;background:#98a0ae}
.rail .mini b.on.has::after{background:#fff}
.rail .sh{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#98a0ae;font-weight:700;margin-bottom:12px}
.rail .pr{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;font-weight:500;color:#3f4653}
.rail .pr .ct{margin-left:auto;font-size:11.5px;font-weight:600;color:#98a0ae}
.rail .stream{padding:0 0 90px}
.rail .day{display:grid;grid-template-columns:96px 1fr;gap:0;border-bottom:1px solid #f2f3f6}
.rail .dcol{padding:20px 16px 20px 26px;text-align:right}
.rail .dcol i{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#98a0ae;font-weight:700}
.rail .dcol b{display:block;font-family:"Instrument Serif",Georgia,serif;font-size:30px;font-weight:400;line-height:1.05;margin-top:2px}
.rail .day.today .dcol b{color:#c0392b}
.rail .day.today .dcol i{color:#c0392b}
.rail .day.empty .ecol{color:#d4d8e0;font-size:13px;padding:4px 0}
.rail .day.empty .dcol{padding:12px 16px 12px 26px}
.rail .day.empty .dcol b{font-size:22px;color:#a8b0bd}
.rail .ecol{padding:16px 26px 18px 0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.rail .er{display:flex;gap:13px;align-items:baseline;padding:9px 13px;border-radius:10px;background:#f6f7f9;border-left:3px solid var(--c)}
.rail .etime{font-size:11.5px;font-weight:700;color:#79808d;min-width:60px;flex-shrink:0}
.rail .etitle{font-size:14.5px;font-weight:600;flex:1}
.rail .ewho{font-size:11.5px;color:#98a0ae;font-weight:500}
@media(max-width:860px){
  .rail .top{padding:16px 16px 13px}
  .rail .month{font-size:25px}
  .rail .body{grid-template-columns:1fr}
  .rail .side{display:none}
  .rail .day{grid-template-columns:66px 1fr}
  .rail .dcol{padding:16px 12px 16px 14px}
  .rail .dcol b{font-size:25px}
  .rail .ecol{padding:12px 14px 14px 0}
  .rail .er{flex-direction:column;gap:2px;padding:10px 12px}
  .rail .etime{min-width:0}
}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-in">
    <div class="chrome-title">Family Hub · Concepts</div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-d="hearth" aria-selected="true">Hearth<small>Warm · editorial</small></button>
      <button class="tab" role="tab" data-d="aurora" aria-selected="false">Aurora<small>Dark · glass</small></button>
      <button class="tab" role="tab" data-d="bulletin" aria-selected="false">Bulletin<small>Bento · modular</small></button>
      <button class="tab" role="tab" data-d="rail" aria-selected="false">Rail<small>Timeline · fast</small></button>
    </div>
    <div class="spacer"></div>
    <div class="vp" id="vp">
      <button data-v="desktop" aria-pressed="true">Desktop</button>
      <button data-v="phone" aria-pressed="false">iPhone</button>
    </div>
  </div>
</div>

<div class="stage" id="stage" data-vp="desktop">
  <div style="width:100%;max-width:1240px">
    <div class="note" id="note"></div>
    <div class="frame" id="frame"></div>
  </div>
</div>

<script>
/* ---------------- sample data (placeholder names) ---------------- */
const PEOPLE = [
  {id:'erich', n:'Erich', c:'#2f6f5e', d:'#5fd6b2'},
  {id:'lisa',  n:'Lisa',  c:'#b4553c', d:'#ff9a76'},
  {id:'noah',  n:'Noah',  c:'#37588f', d:'#7aa8ff'},
  {id:'mia',   n:'Mia',   c:'#7d4a8c', d:'#cf95e8'},
  {id:'all',   n:'Everyone', c:'#9a7b2f', d:'#e8c46a'}
];
const P = Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const TODAY = 19, YR = 2026, MO = 7; // August 2026
const EV = [
  {d:3, p:'lisa', t:'Dentist — Mia', tm:'9:00 AM'},
  {d:5, p:'erich',t:'Client review — Hendricks', tm:'2:00 PM'},
  {d:7, p:'noah', t:'Soccer practice', tm:'5:30 PM'},
  {d:8, p:'all',  t:'Beach day', tm:'All day'},
  {d:12,p:'mia',  t:'Piano lesson', tm:'4:00 PM'},
  {d:14,p:'erich',t:'Date night', tm:'7:00 PM'},
  {d:17,p:'noah', t:'Soccer practice', tm:'5:30 PM'},
  {d:18,p:'lisa', t:'Book club', tm:'7:00 PM'},
  {d:19,p:'erich',t:'Team standup', tm:'8:30 AM'},
  {d:19,p:'mia',  t:'Piano lesson', tm:'4:00 PM'},
  {d:19,p:'all',  t:"Dinner at Grandma's", tm:'6:00 PM'},
  {d:20,p:'noah', t:'Physical — Dr. Reyes', tm:'10:15 AM'},
  {d:21,p:'erich',t:'Payroll deadline', tm:'12:00 PM'},
  {d:22,p:'all',  t:'Church picnic', tm:'All day'},
  {d:24,p:'all',  t:'First day of school', tm:'All day'},
  {d:26,p:'lisa', t:'Parent–teacher conf.', tm:'3:30 PM'},
  {d:28,p:'erich',t:'Quarterly review', tm:'9:00 AM'},
  {d:30,p:'all',  t:'Anniversary', tm:'All day'}
];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const firstDow = new Date(YR,MO,1).getDay();      // Aug 1 2026 = Sat = 6
const dim = new Date(YR,MO+1,0).getDate();        // 31
const prevDim = new Date(YR,MO,0).getDate();      // 31 (July)
const evOn = d => EV.filter(e=>e.d===d);
const dowOf = d => new Date(YR,MO,d).getDay();
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* month grid cells: [{d, out:boolean}] */
function cells(){
  const out=[];
  for(let i=firstDow-1;i>=0;i--) out.push({d:prevDim-i,out:true});
  for(let d=1;d<=dim;d++) out.push({d,out:false});
  while(out.length%7) out.push({d:out.length-firstDow-dim+1,out:true});
  return out;
}

/* ---------------- DESIGN A — HEARTH ---------------- */
function hearth(){
  const grid = cells().map(c=>{
    const evs = c.out?[]:evOn(c.d);
    const show = evs.slice(0,3), rest = evs.length-show.length;
    return `<div class="cell ${c.out?'out':''} ${!c.out&&c.d===TODAY?'today':''}">
      <div class="dnum">${c.d}</div>
      ${show.map(e=>`<div class="ev" style="--c:${P[e.p].c}"><em>${e.tm==='All day'?'':e.tm.replace(':00','').replace(' ','')}</em> ${esc(e.t)}</div>`).join('')}
      ${rest>0?`<div class="more">+${rest} more</div>`:''}
    </div>`;
  }).join('');
  const days = [...new Set(EV.filter(e=>e.d>=17).map(e=>e.d))].sort((a,b)=>a-b);
  const agenda = days.map(d=>`<div class="aday ${d===TODAY?'today':''}">
      <div class="adate">${DOWL[dowOf(d)]}, Aug ${d}${d===TODAY?' · Today':''}</div>
      ${evOn(d).map(e=>`<div class="arow" style="--c:${P[e.p].c}">
        <div class="atime">${e.tm}</div>
        <div><div class="atitle">${esc(e.t)}</div><div class="awho">${P[e.p].n}</div></div>
      </div>`).join('')}
    </div>`).join('');
  return `<div class="app hearth">
    <div class="top">
      <div><h1 class="month">August <span>2026</span></h1><div class="sub">The Kelley Family</div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="navbtns"><button class="nb">&#8249;</button><button class="nb">&#8250;</button></div>
        <button class="add">+ Add event</button>
      </div>
    </div>
    <div class="people">${PEOPLE.map(p=>`<div class="chipp"><span class="dot" style="background:${p.c}"></span>${p.n}</div>`).join('')}</div>
    <div class="grid">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${grid}</div>
    <div class="agenda">${agenda}</div>
  </div>`;
}

/* ---------------- DESIGN B — AURORA ---------------- */
function aurora(){
  const grid = cells().map(c=>{
    const evs = c.out?[]:evOn(c.d);
    const show = evs.slice(0,2), rest = evs.length-show.length;
    return `<div class="cell ${c.out?'out':''} ${!c.out&&c.d===TODAY?'today':''}">
      <div class="dnum">${c.d}</div>
      ${show.map(e=>`<div class="ev" style="--c:${P[e.p].d}">${esc(e.t)}</div>`).join('')}
      ${rest>0?`<div class="more">+${rest}</div>`:''}
    </div>`;
  }).join('');
  const week=[16,17,18,19,20,21,22];
  const strip = week.map(d=>`<div class="wd ${d===TODAY?'on':''}"><i>${DOW[dowOf(d)][0]}</i><b>${d}</b>
    <div class="pips">${evOn(d).slice(0,3).map(e=>`<span style="background:${P[e.p].d}"></span>`).join('')}</div></div>`).join('');
  const days=[19,20,21,22,24].filter(d=>evOn(d).length);
  const agenda = days.map(d=>`<div class="aday ${d===TODAY?'today':''}">
      <div class="adate">${d===TODAY?'Today · ':''}${DOWL[dowOf(d)]} ${d}</div>
      ${evOn(d).map(e=>`<div class="arow" style="--c:${P[e.p].d}">
        <div class="atime">${e.tm.replace(' AM','a').replace(' PM','p')}</div>
        <div><div class="atitle">${esc(e.t)}</div><div class="awho">${P[e.p].n}</div></div>
      </div>`).join('')}
    </div>`).join('');
  return `<div class="app aurora">
    <div class="top">
      <h1 class="month">August <span>2026</span></h1>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="glasspill"><button>Day</button><button>Week</button><button class="on">Month</button></div>
        <button class="add">+ Add</button>
      </div>
    </div>
    <div class="people">${PEOPLE.map(p=>`<div class="chipp"><span class="dot" style="background:${p.d}"></span>${p.n}</div>`).join('')}</div>
    <div class="grid">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${grid}</div>
    <div class="agenda"><div class="wstrip">${strip}</div>${agenda}</div>
  </div>`;
}

/* ---------------- DESIGN C — BULLETIN ---------------- */
function bulletin(){
  const today = evOn(TODAY);
  const week=[16,17,18,19,20,21,22];
  const strip = week.map(d=>`<div class="wd ${d===TODAY?'on':''}"><i>${DOW[dowOf(d)]}</i><b>${d}</b>
    <div class="pips">${evOn(d).slice(0,3).map(e=>`<span style="background:${P[e.p].c}"></span>`).join('')}</div></div>`).join('');
  const upcoming = EV.filter(e=>e.d>TODAY).slice(0,6).map(e=>`<div class="up">
      <div class="upd"><i>${DOW[dowOf(e.d)]}</i><b>${e.d}</b></div>
      <div style="flex:1"><div class="upt">${esc(e.t)}</div><div class="upm">${e.tm} · ${P[e.p].n}</div></div>
      <span class="dot" style="background:${P[e.p].c}"></span>
    </div>`).join('');
  const lanes = PEOPLE.map(p=>`<div class="lane"><span class="dot" style="background:${p.c}"></span>
      <span class="nm">${p.n}</span><span class="ct">${EV.filter(e=>e.p===p.id).length}</span></div>`).join('');
  return `<div class="app bulletin">
    <div class="top">
      <h1 class="hello">Good morning <span>— Wednesday, August 19</span></h1>
      <button class="add">+ Add event</button>
    </div>
    <div class="bento">
      <div class="col">
      <div class="card todaybig" style="order:1">
        <div class="ch"><span>Today</span><b>${today.length} events</b></div>
        <div class="tdate">Wednesday</div>
        <h2 class="tbig">Aug 19</h2>
        ${today.map(e=>`<div class="trow" style="--c:${P[e.p].c}">
          <div class="ttime">${e.tm}</div>
          <div><div class="ttitle">${esc(e.t)}</div><div class="twho">${P[e.p].n}</div></div>
        </div>`).join('')}
      </div>
      <div class="card" style="order:4">
        <div class="ch"><span>Who's busy</span><b>This month</b></div>
        ${lanes}
      </div>
      </div>
      <div class="col">
      <div class="card" style="order:2">
        <div class="ch"><span>This week</span><b>Aug 16 – 22</b></div>
        <div class="weekstrip">${strip}</div>
      </div>
      <div class="card" style="order:3">
        <div class="ch"><span>Coming up</span></div>
        ${upcoming}
      </div>
      <div class="card soon" style="order:5">
        <b>Shopping list · Chores · Meals</b>
        <span>This layout leaves a slot for each new module. Drop them in without redesigning anything.</span>
      </div>
      </div>
    </div>
  </div>`;
}

/* ---------------- DESIGN D — RAIL ---------------- */
function rail(){
  const mini = cells().map(c=>{
    const has = !c.out && evOn(c.d).length;
    return `<b class="${c.out?'out':''} ${!c.out&&c.d===TODAY?'on':''} ${has?'has':''}">${c.d}</b>`;
  }).join('');
  let stream='';
  for(let d=17;d<=31;d++){
    const evs=evOn(d);
    stream += `<div class="day ${d===TODAY?'today':''} ${evs.length?'':'empty'}">
      <div class="dcol"><i>${DOW[dowOf(d)]}</i><b>${d}</b></div>
      <div class="ecol">${evs.length?evs.map(e=>`<div class="er" style="--c:${P[e.p].c}">
          <div class="etime">${e.tm}</div>
          <div class="etitle">${esc(e.t)}</div>
          <div class="ewho">${P[e.p].n}</div>
        </div>`).join(''):'<span>—</span>'}</div>
    </div>`;
  }
  return `<div class="app rail">
    <div class="top">
      <h1 class="month">August <span>2026</span></h1>
      <button class="add">+ Add event</button>
    </div>
    <div class="body">
      <div class="side">
        <div class="mini">${DOW.map(d=>`<i>${d[0]}</i>`).join('')}${mini}</div>
        <div class="sh">Family</div>
        ${PEOPLE.map(p=>`<div class="pr"><span class="dot" style="background:${p.c}"></span>${p.n}<span class="ct">${EV.filter(e=>e.p===p.id).length}</span></div>`).join('')}
      </div>
      <div class="stream">${stream}</div>
    </div>
  </div>`;
}

const D = {hearth, aurora, bulletin, rail};
const NOTES = {
  hearth:{t:'Hearth — warm editorial',b:'Reads like a beautiful paper wall calendar. Cream stock, Fraunces serif, muted ink colors per person.',m:'Desktop shows a full month grid; iPhone switches to a scrolling day-by-day agenda (a 7-column grid is unusable on a phone).',w:'Best if you want the hub to feel like a home object rather than software. Warmest, least "app"-like.'},
  aurora:{t:'Aurora — dark glass',b:'Night-mode-first. Frosted cards over a deep gradient, vivid per-person accents, iOS-native feel.',m:'Desktop month grid; iPhone gets a week strip with per-person dots plus a grouped agenda below.',w:'Best on an OLED iPhone at night and the most modern-looking. Kids will think it looks the coolest.'},
  bulletin:{t:'Bulletin — bento dashboard',b:'Not a calendar first — a "what is happening" board. Big Today card, week strip, upcoming list, per-person load.',m:'Cards reflow to a single column on iPhone. Every future module is just another card.',w:'Best if you want shopping lists, chores and meals later. This is the only layout that grows without a redesign.'},
  rail:{t:'Rail — continuous timeline',b:'One infinite vertical scroll of days, Fantastical-style. Sticky mini-month and family filters on the left.',m:'Sidebar drops away on iPhone; the timeline is already the mobile pattern, so phone and desktop behave identically.',w:'Best for speed. Fewest taps to see "what is coming", and no view-switching to learn.'}
};
let cur='hearth';
function render(){
  document.getElementById('frame').innerHTML = D[cur]();
  const n=NOTES[cur];
  document.getElementById('note').innerHTML =
    `<b>${n.t}</b><div class="kv"><span>Feel</span><span>${n.b}</span></div>`+
    `<div class="kv"><span>Responsive</span><span>${n.m}</span></div>`+
    `<div class="kv"><span>Pick it if</span><span>${n.w}</span></div>`;
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  cur=b.dataset.d;
  [...document.querySelectorAll('.tab')].forEach(t=>t.setAttribute('aria-selected',t===b));
  render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('vp').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.getElementById('stage').dataset.vp=b.dataset.v;
  [...document.querySelectorAll('#vp button')].forEach(t=>t.setAttribute('aria-pressed',t===b));
});
render();
</script>
</body>
